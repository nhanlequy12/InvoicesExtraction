[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-smart-invoice"
version = "1.0.0"
description = "Intelligent Vietnamese E-Invoice Processing, Validation & Accounting Automation Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary / Enterprise"}
authors = [
    {name = "NLQ team"}
]
keywords = [
    "e-invoice",
    "vietnam",
    "invoice-extraction",
    "document-ai",
    "paddleocr",
    "validation-engine",
    "accounting-automation",
    "erp-integration"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "lxml>=5.1.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "minio>=7.2.5",
    "openpyxl>=3.1.2",
    "cryptography>=42.0.5",
    "python-jose[cryptography]>=3.3.0",
    "numpy>=1.26.4"
]

[project.optional-dependencies]
ai = [
    "opencv-python-headless>=4.9.0",
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.3",
    "pillow>=10.2.0",
    "pymupdf>=1.23.26",
    "imagehash>=4.3.1"
]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "black>=24.3.0",
    "ruff>=0.3.3",
    "mypy>=1.9.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
